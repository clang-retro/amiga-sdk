name: check
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', '.docs/**', 'mkdocs.yml', 'clang-retro-docs/**', '.github/workflows/docs.yml', '.github/workflows/clang-retro-docs.yml', 'LICENSE*']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', '.docs/**', 'mkdocs.yml', 'clang-retro-docs/**', '.github/workflows/docs.yml', '.github/workflows/clang-retro-docs.yml', 'LICENSE*']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          sh -n build-sysroot.sh
          bash -n tools/fsuae-test.sh
          sh -n tools/fetch-aros.sh
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

  # Builds the SDK's AmigaOS headers from AROS. CI does not download
  # Hyperion's NDK 3.2, because it is not redistributable: compare with
  # your own copy locally with tools/ndk-compare.py (see os/README.md).
  # Uses the runner's clang 18, which has the m68k back end; its assembler
  # is too old for the stubs, which clang-retro/dos-sdk builds with the
  # SDK's own clang.
  os-headers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the AROS headers
        run: |
          sh -n tools/fetch-aros.sh
          tools/fetch-aros.sh "$RUNNER_TEMP/aros"
      - name: Build the headers
        run: |
          python3 tools/aros-ndk.py --aros "$RUNNER_TEMP/aros" \
            --out "$RUNNER_TEMP/sdk" --no-stubs
